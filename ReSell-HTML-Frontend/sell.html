<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReSell - Sell Your Item</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="favicon.svg">

    <style>
        /* =========================================
           THEMES
           ========================================= */
        :root {
            --nav-bg: #ffffff;
            --nav-text: rgba(32, 41, 58, 1);
            --nav-border: #e2e8f0;
            --input-bg: #f8fafc;
            --body-bg: #0b1120;
            --body-text: #f8fafc;
            --card-bg: #1e293b;
            --card-border: #334155;
            --text-muted: #94a3b8;
            --primary-green: rgba(76, 161, 84, 1);
            --shadow-glow: 0 8px 25px rgba(6, 182, 212, 0.3);
        }

        [data-theme="inverse"] {
            --nav-bg: #0b1120;
            --nav-text: #f8fafc;
            --nav-border: #334155;
            --input-bg: #ffffff;
            --body-bg: #f8fafc;
            --body-text: rgba(32, 41, 58, 1);
            --card-bg: #ffffff;
            --card-border: #e2e8f0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--body-bg);
            color: var(--body-text);
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 5%;
            background-color: var(--nav-bg);
            border-bottom: 2px solid var(--nav-border);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .back-btn {
            color: var(--nav-text);
            text-decoration: none;
            font-weight: 700;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo {
            font-size: 28px;
            font-weight: 900;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: -1px;
            color: var(--nav-text);
        }

        .logo span,
        .logo i,
        .back-btn:hover {
            color: var(--primary-green);
        }

        .theme-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 2px solid var(--nav-border);
            background: transparent;
            color: var(--nav-text);
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .sell-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 40px;
            box-shadow: var(--shadow-glow);
        }

        .page-title {
            text-align: center;
            font-size: 32px;
            font-weight: 900;
            margin-bottom: 30px;
            color: var(--body-text);
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-row {
            display: flex;
            gap: 20px;
        }

        .form-row .form-group {
            flex: 1;
        }

        label {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 13px;
            font-weight: 800;
            color: var(--text-muted);
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        input[type="text"],
        input[type="number"],
        input[type="tel"],
        select,
        textarea {
            width: 100%;
            padding: 15px;
            background: var(--input-bg);
            border: 2px solid var(--card-border);
            border-radius: 8px;
            color: rgba(32, 41, 58, 1);
            font-size: 15px;
            font-weight: 600;
            outline: none;
            transition: all 0.3s ease;
        }

        textarea {
            resize: vertical;
            min-height: 120px;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: var(--primary-green);
            box-shadow: 0 0 0 4px rgba(76, 161, 84, 0.1);
        }

        .upload-box {
            border: 2px dashed var(--text-muted);
            border-radius: 12px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            background: var(--input-bg);
            position: relative;
        }

        .upload-box.error-border {
            border-color: #ef4444;
            background: rgba(239, 68, 68, 0.05);
        }

        .upload-box i {
            font-size: 40px;
            color: var(--text-muted);
            margin-bottom: 10px;
        }

        .upload-box input[type="file"] {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            cursor: pointer;
        }

        .preview-container {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 20px;
        }

        .preview-img {
            width: 100px;
            height: 100px;
            border-radius: 8px;
            object-fit: cover;
            border: 2px solid var(--card-border);
        }

        .img-wrapper {
            position: relative;
        }

        .remove-img {
            position: absolute;
            top: -5px;
            right: -5px;
            background: #ef4444;
            color: white;
            border: none;
            border-radius: 50%;
            width: 22px;
            height: 22px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .submit-btn {
            width: 100%;
            padding: 16px;
            background: var(--nav-text);
            color: var(--nav-bg);
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 900;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .submit-btn:hover {
            background: var(--primary-green);
            color: white;
            transform: translateY(-3px);
        }

        .submit-btn:disabled {
            background: var(--card-border);
            color: var(--text-muted);
            cursor: not-allowed;
            transform: none;
        }

        /* =========================================
           TOAST NOTIFICATION STYLES (NAVA)
           ========================================= */
        #toast {
            visibility: hidden;
            min-width: 250px;
            background-color: var(--primary-green);
            color: #fff;
            text-align: center;
            border-radius: 8px;
            padding: 16px 20px;
            position: fixed;
            z-index: 2000;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            font-size: 15px;
            font-weight: 700;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            opacity: 0;
            transition: opacity 0.4s ease, bottom 0.4s ease;
        }

        #toast.show {
            visibility: visible;
            opacity: 1;
            bottom: 50px;
        }

        /* =========================================
           RESPONSIVE MEDIA QUERIES (NAVA)
           ========================================= */
        @media (max-width: 768px) {
            .navbar {
                padding: 15px 20px;
            }

            .logo {
                font-size: 24px;
            }

            .container {
                margin-top: 20px;
                padding: 0 15px;
            }

            .sell-card {
                padding: 25px 20px;
                border-radius: 12px;
            }

            .page-title {
                font-size: 24px;
                margin-bottom: 20px;
            }

            .form-row {
                flex-direction: column;
                gap: 0;
            }

            .upload-box {
                padding: 25px 10px;
            }

            .upload-box i {
                font-size: 30px;
            }

            input[type="text"],
            input[type="number"],
            input[type="tel"],
            select,
            textarea {
                padding: 12px;
                font-size: 14px;
            }

            .submit-btn {
                padding: 14px;
                font-size: 16px;
            }
        }

        @media (max-width: 480px) {
            .preview-img {
                width: 70px;
                height: 70px;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <a href="index" class="back-btn"><i class="fas fa-arrow-left"></i> Back</a>
        <a href="index" class="logo"> <i class="fas fa-shopping-basket"></i>
            <div>RE<span>SELL</span></div>
        </a>
        <button class="theme-btn" id="themeToggle" title="Change Theme"></button>
    </nav>

    <div class="container">
        <div class="sell-card">
            <h2 class="page-title">Sell Your Item</h2>

            <form id="sellForm">
                <div class="form-group">
                    <label>Title *</label>
                    <input type="text" id="sellTitle" placeholder="e.g. iPhone 13 Pro Max" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Price (₹) *</label>
                        <input type="number" id="sellPrice" placeholder="e.g. 50000" required>
                    </div>
                    <div class="form-group">
                        <label>Category *</label>
                        <select id="sellCategory" required>
                            <option value="" disabled selected>Select Category</option>
                            <option value="Mobile">Mobile</option>
                            <option value="Laptop">Laptop</option>
                            <option value="Car">Car</option>
                            <option value="Bike">Bike</option>
                            <option value="Tablet">Tablet</option>
                            <option value="Home">Home</option>
                            <option value="Furniture">Furniture</option>
                            <option value="Sports">Sports</option>
                            <option value="Electronics">Electronics & Appliances</option>
                            <option value="Others">Others</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>Location *</label>
                    <input type="text" id="sellLocation" placeholder="e.g. Bathinda, Punjab" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Mobile Number *</label>
                        <input type="tel" id="sellPhone" placeholder="10-digit mobile number" pattern="[0-9]{10}"
                            maxlength="10" oninput="this.value = this.value.replace(/[^0-9]/g, '')" required>
                    </div>
                    <div class="form-group">
                        <label><i class="fab fa-whatsapp" style="color: #25D366; font-size: 16px;"></i> Whatsapp Number
                            *</label>
                        <input type="tel" id="sellAltPhone" placeholder="10-digit whatsapp number" pattern="[0-9]{10}"
                            maxlength="10" oninput="this.value = this.value.replace(/[^0-9]/g, '')" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Description *</label>
                    <textarea id="sellDesc" placeholder="Describe your item in detail..." required></textarea>
                </div>

                <div class="form-group">
                    <label>Upload Images (1 to 5) *</label>
                    <div class="upload-box" id="dropZone">
                        <i class="fas fa-cloud-upload-alt"></i>
                        <p>Click to upload photos</p>
                        <input type="file" id="fileInput" multiple accept="image/*">
                    </div>
                    <div class="preview-container" id="previewContainer"></div>
                </div>

                <button type="submit" class="submit-btn" id="submitBtn">POST NOW <i
                        class="fas fa-arrow-right"></i></button>
            </form>
        </div>
    </div>

    <div id="toast"></div>

    <script>
        // ==========================================
        // TOAST NOTIFICATION LOGIC
        // ==========================================
        function showToast(message, isError = false) {
            const toast = document.getElementById("toast");
            toast.innerText = message;
            toast.style.backgroundColor = isError ? "#ef4444" : "var(--primary-green)";
            toast.classList.add("show");
            setTimeout(() => { toast.classList.remove("show"); }, 3000);
        }

        // Theme Logic
        const themeToggleBtn = document.getElementById('themeToggle');
        const htmlElement = document.documentElement;

        function applyTheme(themeName) {
            if (themeName === 'inverse') { htmlElement.setAttribute('data-theme', 'inverse'); themeToggleBtn.innerHTML = '<i class="fas fa-sun"></i>'; }
            else { htmlElement.removeAttribute('data-theme'); themeToggleBtn.innerHTML = '<i class="fas fa-moon"></i>'; }
        }
        let currentTheme = localStorage.getItem('siteTheme') || 'default';
        applyTheme(currentTheme);

        themeToggleBtn.addEventListener('click', () => {
            currentTheme = (currentTheme === 'inverse') ? 'default' : 'inverse';
            localStorage.setItem('siteTheme', currentTheme);
            applyTheme(currentTheme);
        });

        // Auth Check
        const userName = localStorage.getItem('userName');
        if (localStorage.getItem('isLoggedIn') !== 'true' || !userName) {
            // Toast will not be able to redirect properly here before user sees it on first load, so standard alert is okay or immediate redirect
            window.location.href = 'login';
        }

        // Image Compression
        const fileInput = document.getElementById('fileInput');
        const previewContainer = document.getElementById('previewContainer');
        const dropZone = document.getElementById('dropZone');
        let selectedFiles = [];

        function compressImage(file, callback) {
            const reader = new FileReader();
            reader.onload = function (event) {
                const img = new Image();
                img.onload = function () {
                    const canvas = document.createElement('canvas');
                    const MAX_WIDTH = 800;
                    let width = img.width; let height = img.height;

                    if (width > height && width > MAX_WIDTH) {
                        height *= MAX_WIDTH / width; width = MAX_WIDTH;
                    } else if (height > MAX_WIDTH) {
                        width *= MAX_WIDTH / height; height = MAX_WIDTH;
                    }
                    canvas.width = width; canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    callback(canvas.toDataURL('image/jpeg', 0.6));
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        }

        fileInput.addEventListener('change', function (e) {
            const files = Array.from(e.target.files);
            dropZone.classList.remove('error-border');

            files.forEach(file => {
                if (selectedFiles.length >= 5) return;
                compressImage(file, function (compressedBase64) {
                    selectedFiles.push(compressedBase64);
                    const imgWrapper = document.createElement('div');
                    imgWrapper.className = 'img-wrapper';
                    imgWrapper.innerHTML = `<img src="${compressedBase64}" class="preview-img"><button type="button" class="remove-img"><i class="fas fa-times"></i></button>`;
                    imgWrapper.querySelector('.remove-img').onclick = function () {
                        selectedFiles = selectedFiles.filter(src => src !== compressedBase64);
                        imgWrapper.remove();
                    };
                    previewContainer.appendChild(imgWrapper);
                });
            });
            fileInput.value = '';
        });

        // Form Submit
        document.getElementById('sellForm').addEventListener('submit', async function (e) {
            e.preventDefault();

            if (selectedFiles.length === 0) {
                dropZone.classList.add('error-border');
                showToast("Please upload at least 1 image!", true);
                return;
            }

            const title = document.getElementById('sellTitle').value.trim();
            const price = Number(document.getElementById('sellPrice').value);
            const category = document.getElementById('sellCategory').value;
            const loc = document.getElementById('sellLocation').value.trim();
            const phone = document.getElementById('sellPhone').value.trim();
            const altPhone = document.getElementById('sellAltPhone').value.trim();
            const desc = document.getElementById('sellDesc').value.trim();

            if (!title || !price || !category || !loc || !phone || !desc) {
                showToast("Please fill all required fields correctly!", true);
                return;
            }

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.innerText = "POSTING..."; submitBtn.disabled = true;

            const dateObj = new Date();
            const dateStr = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"][dateObj.getMonth()] + " " + dateObj.getDate();

            const newProduct = {
                title, price, category, loc, phone, altPhone, desc,
                date: dateStr,
                sellerName: userName,
                sellerEmail: localStorage.getItem('userEmail') || "no-email",
                img: selectedFiles[0],
                images: selectedFiles
            };

            try {
                const response = await fetch('/api/add-product', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(newProduct)
                });

                const data = await response.json();

                if (data.success) {
                    showToast("Product successfully added! Redirecting...");
                    // Thoda delay taaki user toast message padh sake
                    setTimeout(() => {
                        window.location.href = "index";
                    }, 1500);
                } else {
                    showToast("Backend Error: " + data.message, true);
                    submitBtn.innerHTML = 'POST NOW <i class="fas fa-arrow-right"></i>';
                    submitBtn.disabled = false;
                }
            } catch (err) {
                showToast("Network/Server Error! Make sure server.js is running.", true);
                submitBtn.innerHTML = 'POST NOW <i class="fas fa-arrow-right"></i>';
                submitBtn.disabled = false;
            }
        });
    </script>
</body>

</html>
