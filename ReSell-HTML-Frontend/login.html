<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReSell - Login & Sign Up</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --nav-bg: #ffffff;
            --nav-text: rgba(32, 41, 58, 1);
            --nav-border: #e2e8f0;
            --input-bg: #f8fafc;
            --body-bg: #0b1120;
            --body-text: #f8fafc;
            --card-bg: #1e293b;
            --card-border: #334155;
            --text-muted: #94a3b8;
            --primary-green: rgba(76, 161, 84, 1);
            --shadow-glow: 0 8px 25px rgba(6, 182, 212, 0.3);
        }

        [data-theme="inverse"] {
            --nav-bg: #0b1120;
            --nav-text: #f8fafc;
            --nav-border: #334155;
            --input-bg: #f1f5f9;
            --body-bg: #f8fafc;
            --body-text: rgba(32, 41, 58, 1);
            --card-bg: #ffffff;
            --card-border: #e2e8f0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }

        body {
            background-color: var(--body-bg);
            color: var(--body-text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .auth-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 5%;
        }

        .back-btn {
            color: var(--body-text);
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: color 0.3s;
        }

        .back-btn:hover {
            color: var(--primary-green);
        }

        .logo {
            font-size: 28px;
            font-weight: 900;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: -1px;
            color: var(--body-text);
        }

        .logo i,
        .logo span {
            color: var(--primary-green);
        }

        .auth-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .auth-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            width: 100%;
            max-width: 450px;
            padding: 30px;
            box-shadow: var(--shadow-glow);
        }

        .auth-title {
            text-align: center;
            font-size: 24px;
            font-weight: 900;
            margin-bottom: 5px;
        }

        .auth-subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 25px;
        }

        .main-toggle {
            display: flex;
            background: var(--body-bg);
            border-radius: 8px;
            padding: 4px;
            margin-bottom: 25px;
            position: relative;
        }

        .toggle-btn {
            flex: 1;
            padding: 10px;
            text-align: center;
            font-weight: 700;
            cursor: pointer;
            z-index: 2;
            color: var(--text-muted);
            transition: color 0.3s;
        }

        .toggle-btn.active {
            color: #ffffff;
        }

        [data-theme="inverse"] .toggle-btn.active {
            color: #ffffff;
        }

        .toggle-slider {
            position: absolute;
            top: 4px;
            bottom: 4px;
            width: calc(50% - 4px);
            background: var(--primary-green);
            border-radius: 6px;
            transition: transform 0.3s;
            z-index: 1;
        }

        .slider-right {
            transform: translateX(100%);
        }

        .auth-form {
            display: none;
            animation: fadeIn 0.4s ease;
        }

        .auth-form.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .input-group {
            position: relative;
            margin-bottom: 15px;
        }

        .input-group>i:first-child {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 16px;
        }

        .input-group input {
            width: 100%;
            padding: 14px 45px;
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            color: var(--nav-text);
            font-size: 14px;
            font-weight: 500;
            outline: none;
        }

        .input-group input:focus {
            border-color: var(--primary-green);
            box-shadow: 0 0 0 3px rgba(76, 161, 84, 0.1);
        }

        .eye-btn {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 16px;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: var(--nav-text);
            color: var(--nav-bg);
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }

        .submit-btn:hover {
            background: var(--primary-green);
            color: white;
        }

        .forgot-link {
            display: block;
            text-align: right;
            margin-top: -8px;
            margin-bottom: 15px;
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
            text-decoration: none;
        }

        .forgot-link:hover {
            color: var(--primary-green);
        }
    </style>
</head>

<body>

    <header class="auth-header">
        <a href="home.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Home</a>
        <a href="home.html" class="logo"><i class="fas fa-shopping-basket"></i>
            <div>RE<span>SELL</span></div>
        </a>
    </header>

    <div class="auth-wrapper">
        <div class="auth-card">

            <h2 class="auth-title" id="formTitle">Welcome Back</h2>
            <p class="auth-subtitle" id="formSubtitle">Login to manage your store</p>

            <div class="main-toggle" id="mainToggleGroup">
                <div class="toggle-slider" id="toggleSlider"></div>
                <div class="toggle-btn active" id="toggleLogin" onclick="switchForm('login')">Login</div>
                <div class="toggle-btn" id="toggleSignup" onclick="switchForm('signup')">Sign Up</div>
            </div>

            <div id="loginSection" class="auth-form active">
                <form id="loginForm">
                    <div class="input-group">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="loginEmail" placeholder="Email Address" required>
                    </div>
                    <div class="input-group" style="margin-bottom: 10px;">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="loginPass" placeholder="Password" required>
                        <button type="button" class="eye-btn" onclick="togglePassword('loginPass', this)"><i
                                class="fas fa-eye"></i></button>
                    </div>
                    <a href="#" class="forgot-link" onclick="switchForm('forgot')">Forgot Password?</a>
                    <button type="submit" class="submit-btn">Login <i class="fas fa-arrow-right"></i></button>
                </form>
            </div>

            <div id="signupSection" class="auth-form">
                <form id="signupForm">
                    <div class="input-group">
                        <i class="fas fa-user"></i>
                        <input type="text" id="signupName" placeholder="Full Name" required>
                    </div>
                    <div class="input-group">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="signupEmail" placeholder="Email Address" required>
                    </div>
                    <div class="input-group" style="margin-bottom: 25px;">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="signupPass" placeholder="Create Password" required>
                        <button type="button" class="eye-btn" onclick="togglePassword('signupPass', this)"><i
                                class="fas fa-eye"></i></button>
                    </div>
                    <button type="submit" class="submit-btn" id="createAccountBtn">Create Account <i
                            class="fas fa-arrow-right"></i></button>
                </form>
            </div>

        </div>
    </div>

    <script>
        if (localStorage.getItem('siteTheme') === 'inverse') document.documentElement.setAttribute('data-theme', 'inverse');

        function switchForm(type) {
            const slider = document.getElementById('toggleSlider');
            const toggleGroup = document.getElementById('mainToggleGroup');

            document.querySelectorAll('.auth-form').forEach(form => form.classList.remove('active'));
            document.querySelectorAll('.toggle-btn').forEach(btn => btn.classList.remove('active'));

            if (type === 'signup') {
                slider.classList.add('slider-right');
                document.getElementById('toggleSignup').classList.add('active');
                document.getElementById('signupSection').classList.add('active');
                document.getElementById('formTitle').innerText = "Create Account";
                document.getElementById('formSubtitle').innerText = "Join Re-sell securely today";
            } else {
                slider.classList.remove('slider-right');
                document.getElementById('toggleLogin').classList.add('active');
                document.getElementById('loginSection').classList.add('active');
                document.getElementById('formTitle').innerText = "Welcome Back";
                document.getElementById('formSubtitle').innerText = "Login to manage your store";
            }
        }

        function togglePassword(inputId, btn) {
            const input = document.getElementById(inputId);
            const icon = btn.querySelector('i');
            if (input.type === "password") { input.type = "text"; icon.className = 'fas fa-eye-slash'; }
            else { input.type = "password"; icon.className = 'fas fa-eye'; }
        }

        // ==========================================
        // LOGIN LOGIC (FIXED EMAIL SAVING)
        // ==========================================
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPass').value;

            try {
                const res = await fetch('http://localhost:3000/api/login', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email, password })
                });
                const data = await res.json();

                if (data.success) {
                    // SAARI DETAILS PAKKE TAUR TE SAVE KITIYAN
                    localStorage.setItem('isLoggedIn', 'true');
                    localStorage.setItem('userName', data.userName);
                    localStorage.setItem('userEmail', email);

                    alert(`Welcome back, ${data.userName}!`);
                    window.location.href = 'home.html';
                } else {
                    alert(data.message);
                }
            } catch (err) { alert("Server error"); }
        });

        // ==========================================
        // SIGNUP LOGIC
        // ==========================================
        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('signupName').value;
            const email = document.getElementById('signupEmail').value;
            const password = document.getElementById('signupPass').value;

            // Simple signup without OTP for fast testing
            try {
                const res = await fetch('http://localhost:3000/api/register', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name, email, password, otp: "123456" }) // Bypass OTP strictly for smooth flow if OTP is disabled, otherwise ensure your OTP logic is added here.
                });
                const data = await res.json();
                alert(data.message);
                if (data.success) {
                    document.getElementById('signupForm').reset();
                    switchForm('login');
                }
            } catch (err) { alert("Server error"); }
        });
    </script>
</body>

</html>
