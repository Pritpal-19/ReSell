<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReSell - Login & Sign Up</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="favicon.svg">
    <style>
        :root {
            --nav-bg: #ffffff;
            --nav-text: rgba(32, 41, 58, 1);
            --nav-border: #e2e8f0;
            --input-bg: #f8fafc;
            --body-bg: #0b1120;
            --body-text: #f8fafc;
            --card-bg: #1e293b;
            --card-border: #334155;
            --text-muted: #94a3b8;
            --primary-green: rgba(76, 161, 84, 1);
            --shadow-glow: 0 8px 25px rgba(6, 182, 212, 0.3);
        }

        [data-theme="inverse"] {
            --nav-bg: #0b1120;
            --nav-text: #f8fafc;
            --nav-border: #334155;
            --input-bg: #f1f5f9;
            --body-bg: #f8fafc;
            --body-text: rgba(32, 41, 58, 1);
            --card-bg: #ffffff;
            --card-border: #e2e8f0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }

        body {
            background-color: var(--body-bg);
            color: var(--body-text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        .auth-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 5%;
        }

        .back-btn {
            color: var(--body-text);
            text-decoration: none;
            font-weight: 600;
            font-size: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: color 0.3s;
        }

        .back-btn:hover {
            color: var(--primary-green);
        }

        .logo {
            font-size: 28px;
            font-weight: 900;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: -1px;
            color: var(--body-text);
        }

        .logo i,
        .logo span {
            color: var(--primary-green);
        }

        .auth-wrapper {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .auth-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            width: 100%;
            max-width: 450px;
            padding: 30px;
            box-shadow: var(--shadow-glow);
        }

        .auth-title {
            text-align: center;
            font-size: 24px;
            font-weight: 900;
            margin-bottom: 5px;
        }

        .auth-subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 25px;
        }

        .main-toggle {
            display: flex;
            background: var(--body-bg);
            border-radius: 8px;
            padding: 4px;
            margin-bottom: 25px;
            position: relative;
        }

        .toggle-btn {
            flex: 1;
            padding: 10px;
            text-align: center;
            font-weight: 700;
            cursor: pointer;
            z-index: 2;
            color: var(--text-muted);
            transition: color 0.3s;
        }

        .toggle-btn.active {
            color: #ffffff;
        }

        [data-theme="inverse"] .toggle-btn.active {
            color: #ffffff;
        }

        .toggle-slider {
            position: absolute;
            top: 4px;
            bottom: 4px;
            width: calc(50% - 4px);
            background: var(--primary-green);
            border-radius: 6px;
            transition: transform 0.3s;
            z-index: 1;
        }

        .slider-right {
            transform: translateX(100%);
        }

        .auth-form {
            display: none;
            animation: fadeIn 0.4s ease;
        }

        .auth-form.active {
            display: block;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .input-group {
            position: relative;
            margin-bottom: 15px;
        }

        .input-group>i:first-child {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 16px;
        }

        .input-group input {
            width: 100%;
            padding: 14px 45px;
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            color: #1e293b; /* TEXT COLOR FIX */
            font-size: 14px;
            font-weight: 500;
            outline: none;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .input-group input:focus {
            border-color: var(--primary-green);
            box-shadow: 0 0 0 3px rgba(76, 161, 84, 0.1);
        }

        .eye-btn {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 16px;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: var(--nav-text);
            color: var(--nav-bg);
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
            transition: all 0.3s ease;
        }

        .submit-btn:hover {
            background: var(--primary-green);
            color: white;
        }

        .submit-btn:disabled {
            background: var(--card-border);
            color: var(--text-muted);
            cursor: not-allowed;
        }

        .forgot-link {
            display: block;
            text-align: right;
            margin-top: -8px;
            margin-bottom: 15px;
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
            text-decoration: none;
        }

        .forgot-link:hover {
            color: var(--primary-green);
        }

        /* =========================================
           TOAST NOTIFICATION STYLES
           ========================================= */
        #toast {
            visibility: hidden;
            min-width: 250px;
            background-color: var(--primary-green);
            color: #fff;
            text-align: center;
            border-radius: 8px;
            padding: 16px 20px;
            position: fixed;
            z-index: 2000;
            left: 50%;
            bottom: 30px;
            transform: translateX(-50%);
            font-size: 15px;
            font-weight: 700;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            opacity: 0;
            transition: opacity 0.4s ease, bottom 0.4s ease;
        }

        #toast.show {
            visibility: visible;
            opacity: 1;
            bottom: 50px;
        }

        /* =========================================
           RESPONSIVE MEDIA QUERIES
           ========================================= */
        @media (max-width: 768px) {
            .auth-header {
                padding: 15px 20px;
            }

            .logo {
                font-size: 24px;
            }

            .auth-wrapper {
                padding: 15px;
            }

            .auth-card {
                padding: 25px 20px;
            }

            .auth-title {
                font-size: 22px;
            }
        }

        @media (max-width: 480px) {
            .auth-card {
                padding: 20px 15px;
                border-radius: 12px;
                border: none;
                box-shadow: none;
            }

            .logo {
                font-size: 22px;
            }

            .auth-title {
                font-size: 20px;
            }

            .submit-btn {
                padding: 12px;
                font-size: 15px;
            }

            .input-group input {
                padding: 12px 40px;
                font-size: 13px;
            }

            .input-group>i:first-child {
                left: 12px;
            }

            .eye-btn {
                right: 12px;
            }
        }

        /* OTP Glowing Effects */
        .glow-success {
            border-color: var(--primary-green) !important;
            box-shadow: 0 0 10px var(--primary-green) !important;
        }

        .glow-error {
            border-color: #ef4444 !important;
            box-shadow: 0 0 10px #ef4444 !important;
        }

        #otpSection {
            display: none;
            margin-top: 15px;
        }
    </style>
</head>

<body>
    <header class="auth-header">
        <a href="index" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Home</a>
        <a href="index" class="logo"><i class="fas fa-shopping-basket"></i>
            <div>RE<span>SELL</span></div>
        </a>
    </header>
    <div class="auth-wrapper">
        <div class="auth-card">
            <h2 class="auth-title" id="formTitle">Welcome Back</h2>
            <p class="auth-subtitle" id="formSubtitle">Login to manage your store</p>
            <div class="main-toggle" id="mainToggleGroup">
                <div class="toggle-slider" id="toggleSlider"></div>
                <div class="toggle-btn active" id="toggleLogin" onclick="switchForm('login')">Login</div>
                <div class="toggle-btn" id="toggleSignup" onclick="switchForm('signup')">Sign Up</div>
            </div>
            <div id="loginSection" class="auth-form active">
                <form id="loginForm">
                    <div class="input-group">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="loginEmail" placeholder="Email Address" required>
                    </div>
                    <div class="input-group" style="margin-bottom: 10px;">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="loginPass" placeholder="Password" required>
                        <button type="button" class="eye-btn" onclick="togglePassword('loginPass', this)"><i
                                class="fas fa-eye"></i></button>
                    </div>
                    <a href="#forgotSection" class="forgot-link" onclick="switchForm('forgot'); return false;">Forgot
                        Password?</a>
                    <button type="submit" class="submit-btn" id="loginBtn">Login <i
                            class="fas fa-arrow-right"></i></button>
                </form>
            </div>
            <div id="signupSection" class="auth-form">
                <form id="signupForm">
                    <div class="input-group">
                        <i class="fas fa-user"></i>
                        <input type="text" id="signupName" placeholder="Full Name" required>
                    </div>
                    <div class="input-group">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="signupEmail" placeholder="Email Address" required>
                    </div>
                    <div class="input-group" style="margin-bottom: 25px;">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="signupPass" placeholder="Create Password" required>
                        <button type="button" class="eye-btn" onclick="togglePassword('signupPass', this)"><i
                                class="fas fa-eye"></i></button>
                    </div>
                    <button type="button" id="sendOtpBtn" class="submit-btn" style="background: #3b82f6;"
                        onclick="sendOtp()">Send OTP</button>
                    <div id="otpSection">
                        <div class="input-group">
                            <i class="fas fa-key"></i>
                            <input type="text" id="signupOtp" placeholder="Enter OTP" maxlength="6">
                        </div>
                        <button type="button" id="verifyOtpBtn" class="submit-btn" style="background: #f59e0b;"
                            onclick="verifyOtp()">Verify OTP</button>
                    </div>
                    <button type="submit" class="submit-btn" id="createAccountBtn" disabled>Create Account <i
                            class="fas fa-arrow-right"></i></button>
                </form>
            </div>
            <div id="forgotSection" class="auth-form">
                <p class="auth-subtitle" style="margin-bottom: 20px;">Enter your email to receive a password reset OTP.
                </p>
                <form id="forgotForm">
                    <div class="input-group" style="margin-bottom: 15px;">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="forgotEmail" placeholder="Email Address" required>
                    </div>
                    <button type="button" id="forgotSendOtpBtn" class="submit-btn" style="background: #3b82f6;"
                        onclick="sendForgotOtp()">Send OTP</button>
                    <div id="forgotOtpArea" style="display: none; margin-top: 15px;">
                        <div class="input-group" style="margin-bottom: 15px;">
                            <i class="fas fa-key"></i>
                            <input type="text" id="forgotOtp" placeholder="Enter 6-digit OTP" maxlength="6">
                        </div>
                        <div class="input-group" style="margin-bottom: 10px;">
                            <i class="fas fa-lock"></i>
                            <input type="password" id="forgotNewPass" placeholder="New Password" required>
                            <button type="button" class="eye-btn" onclick="togglePassword('forgotNewPass', this)"><i
                                    class="fas fa-eye"></i></button>
                        </div>
                        <p style="font-size: 11px; color: var(--text-muted); margin-bottom: 15px; text-align: left;">
                            Must be at least 8 characters, include a capital letter, a number, and a special character.
                        </p>
                        <button type="button" class="submit-btn" style="background: var(--primary-green);"
                            onclick="resetPassword()">Reset Password</button>
                    </div>
                    <div style="text-align: center; margin-top: 20px;">
                        <a href="#"
                            style="color: var(--text-muted); font-size: 14px; text-decoration: none; font-weight: bold;"
                            onclick="switchForm('login'); return false;">
                            <i class="fas fa-arrow-left"></i> Back to Login
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <div id="toast"></div>

    <script>
        if (localStorage.getItem('siteTheme') === 'inverse') document.documentElement.setAttribute('data-theme', 'inverse');

        // ==========================================
        // TOAST NOTIFICATION LOGIC
        // ==========================================
        function showToast(message, isError = false) {
            const toast = document.getElementById("toast");
            toast.innerText = message;
            toast.style.backgroundColor = isError ? "#ef4444" : "var(--primary-green)";
            toast.classList.add("show");
            setTimeout(() => { toast.classList.remove("show"); }, 3000);
        }

        function switchForm(type) {
            const slider = document.getElementById('toggleSlider');
            const mainToggleGroup = document.getElementById('mainToggleGroup');

            document.querySelectorAll('.auth-form').forEach(form => form.classList.remove('active'));
            document.querySelectorAll('.toggle-btn').forEach(btn => btn.classList.remove('active'));

            if (type === 'signup') {
                mainToggleGroup.style.display = 'flex';
                slider.classList.add('slider-right');
                document.getElementById('toggleSignup').classList.add('active');
                document.getElementById('signupSection').classList.add('active');
                document.getElementById('formTitle').innerText = "Create Account";
                document.getElementById('formSubtitle').innerText = "Join ReSell securely today";
            } else if (type === 'forgot') {
                mainToggleGroup.style.display = 'none'; // Login/Signup de button hide kar ditte
                document.getElementById('forgotSection').classList.add('active');
                document.getElementById('formTitle').innerText = "Reset Password";
                document.getElementById('formSubtitle').innerText = "Don't worry, we've got you covered";
            } else {
                mainToggleGroup.style.display = 'flex';
                slider.classList.remove('slider-right');
                document.getElementById('toggleLogin').classList.add('active');
                document.getElementById('loginSection').classList.add('active');
                document.getElementById('formTitle').innerText = "Welcome Back";
                document.getElementById('formSubtitle').innerText = "Login to manage your store";
            }
        }

        function togglePassword(inputId, btn) {
            const input = document.getElementById(inputId);
            const icon = btn.querySelector('i');
            if (input.type === "password") { input.type = "text"; icon.className = 'fas fa-eye-slash'; }
            else { input.type = "password"; icon.className = 'fas fa-eye'; }
        }

        // ==========================================
        // LOGIN LOGIC
        // ==========================================
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPass').value;
            const btn = document.getElementById('loginBtn');

            btn.innerHTML = 'Logging in... <i class="fas fa-spinner fa-spin"></i>';
            btn.disabled = true;

            try {
                const res = await fetch('/api/login', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email, password })
                });
                const data = await res.json();

                if (data.success) {
                    localStorage.setItem('isLoggedIn', 'true');
                    localStorage.setItem('userName', data.userName);
                    localStorage.setItem('userEmail', email);
                    showToast(`Welcome back, ${data.userName}!`);
                    
                    setTimeout(() => {
                        window.location.href = 'index';
                    }, 1500);
                } else {
                    showToast(data.message, true);
                    btn.innerHTML = 'Login <i class="fas fa-arrow-right"></i>';
                    btn.disabled = false;
                }
            } catch (err) {
                showToast("Server connection error! Please ensure backend is running.", true);
                btn.innerHTML = 'Login <i class="fas fa-arrow-right"></i>';
                btn.disabled = false;
            }
        });

        // ==========================================
        // SIGNUP LOGIC (UPDATED)
        // ==========================================
        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('signupName').value;
            const email = document.getElementById('signupEmail').value;
            const password = document.getElementById('signupPass').value;
            const otp = document.getElementById('signupOtp').value;
            const btn = document.getElementById('createAccountBtn');

            btn.innerHTML = 'Creating... <i class="fas fa-spinner fa-spin"></i>';
            btn.disabled = true;

            try {
                const res = await fetch('/api/register', {
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' }, 
                    body: JSON.stringify({ name, email, password, otp })
                });
                const data = await res.json();

                if (data.success) {
                    showToast(data.message);
                    document.getElementById('signupForm').reset();
                    setTimeout(() => {
                        switchForm('login');
                        btn.innerHTML = 'Create Account <i class="fas fa-arrow-right"></i>';
                        btn.disabled = false;
                    }, 1500);
                } else {
                    showToast(data.message, true);
                    btn.innerHTML = 'Create Account <i class="fas fa-arrow-right"></i>';
                    btn.disabled = false;
                }
            } catch (err) {
                showToast("Server connection error! Please ensure backend is running.", true);
                btn.innerHTML = 'Create Account <i class="fas fa-arrow-right"></i>';
                btn.disabled = false;
            }
        });

        async function sendOtp() {
            const email = document.getElementById('signupEmail').value;
            if (!email) return showToast("Please enter email first", true);

            document.getElementById('sendOtpBtn').innerText = "Sending...";
            const res = await fetch('/api/send-otp', {
                method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email })
            });
            const data = await res.json();

            if (data.success) {
                showToast("OTP sent to your email!");
                document.getElementById('otpSection').style.display = 'block';
                document.getElementById('sendOtpBtn').style.display = 'none';
            } else {
                showToast(data.message, true);
                document.getElementById('sendOtpBtn').innerText = "Send OTP";
            }
        }

        async function verifyOtp() {
            const email = document.getElementById('signupEmail').value;
            const otp = document.getElementById('signupOtp').value;
            const otpInput = document.getElementById('signupOtp');

            const res = await fetch('/api/verify-otp', {
                method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email, otp })
            });
            const data = await res.json();

            if (data.success) {
                const verifyBtn = document.getElementById('verifyOtpBtn');
                verifyBtn.innerText = 'Verified!';
                verifyBtn.style.backgroundColor = '#28a745'; 
                verifyBtn.style.color = 'white';
                verifyBtn.disabled = true; 

                // Account create karan aale button nu enable kardo
                document.getElementById('createAccountBtn').disabled = false;

                showToast("OTP Verified Successfully!");
            } else {
                showToast("Invalid OTP!", true);
                otpInput.classList.add('glow-error');
                otpInput.value = ""; 
                setTimeout(() => otpInput.classList.remove('glow-error'), 1000);
            }
        }

        // ==========================================
        // FORGOT PASSWORD LOGIC
        // ==========================================
        async function sendForgotOtp() {
            const email = document.getElementById('forgotEmail').value;
            if (!email) return showToast("Please enter your email", true);
            const btn = document.getElementById('forgotSendOtpBtn');
            btn.innerText = "Sending...";
            btn.disabled = true;

            try {
                const res = await fetch('/api/forgot-password-otp', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email })
                });
                const data = await res.json();

                if (data.success) {
                    showToast("OTP sent to your email!");
                    document.getElementById('forgotOtpArea').style.display = 'block';
                    btn.style.display = 'none';
                    document.getElementById('forgotEmail').readOnly = true;
                    document.getElementById('forgotEmail').style.opacity = '0.6';
                } else {
                    showToast(data.message, true);
                    btn.innerText = "Send OTP";
                    btn.disabled = false;
                }
            } catch (error) {
                showToast("Server connection error!", true);
                btn.innerText = "Send OTP";
                btn.disabled = false;
            }
        }

        async function resetPassword() {
            const email = document.getElementById('forgotEmail').value;
            const otp = document.getElementById('forgotOtp').value;
            const newPassword = document.getElementById('forgotNewPass').value;
            if (!otp || !newPassword) return showToast("Please fill all fields", true);

            // Password Check 
            const passwordRegex = /^(?=.*[A-Z])(?=.*\d)(?=.*[!@#$%^&*])[A-Za-z\d!@#$%^&*]{8,}$/;
            if (!passwordRegex.test(newPassword)) {
                return showToast("Password does not meet complexity requirements.", true);
            }

            try {
                const res = await fetch('/api/reset-password', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email, newPassword, otp })
                });
                const data = await res.json();
                if (data.success) {
                    showToast("Password Reset Successful!");
                    setTimeout(() => {
                        window.location.reload(); 
                    }, 1500);
                } else {
                    showToast(data.message, true);
                }
            } catch (error) {
                showToast("Server connection error!", true);
            }
        }
    </script>
</body>

</html>
